[plugin]
id=sv.testroom
version=0.2.3
library=testroom.dll
api=1
live=1
capabilities=read,write,ai,economy,mission,settings,storage,engine,shop,props,config,plugins

[setting.greeting]
type=text
default=hello
label=Greeting
live=1
admin=1

[setting.count]
type=int
default=3
min=0
max=100
label=Count
live=1
admin=1

[setting.scale]
type=float
default=1.5
min=0
max=10
label=Scale
live=1
admin=1
