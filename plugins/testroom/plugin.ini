[plugin]
id=sv.testroom
version=0.2.18
library=testroom.dll
api=1
live=1
capabilities=read,write,ai,economy,mission,settings,storage,engine,shop,props,config,plugins,network
name=In-game Test Room
description=Test cases that run inside the game, for server developers.
author=Vulpzin
license=GPL-3.0-only

[setting.greeting]
type=text
default=hello
label=Greeting
live=1
admin=1

[setting.count]
type=int
default=3
min=0
max=100
label=Count
live=1
admin=1

[setting.scale]
type=float
default=1.5
min=0
max=10
label=Scale
live=1
admin=1
