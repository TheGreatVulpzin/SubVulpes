[plugin]
id=sv.logging
name=Logging System
version=0.1.0
library=logging.dll
api=1
live=1
capabilities=read,write,config,plugins
description=One fixed log line for each action of an administrator, for other plugins to call.
author=Vulpzin
license=GPL-3.0-only

[setting.record_actions]
type=flag
default=1
label=Record actions that worked
help=Plugins send the dangerous ones, for example kill, give and round reset.
live=1

[setting.record_failures]
type=flag
default=1
label=Record actions that failed
live=1
