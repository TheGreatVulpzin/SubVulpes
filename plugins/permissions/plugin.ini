[plugin]
id=sv.permissions
name=Permission System
version=0.2.0
library=permissions.dll
api=1
live=1
capabilities=read,write,props,storage,config,plugins
description=Groups, permission nodes and password login policy.
author=Vulpzin
license=GPL-3.0-only

[setting.default_group]
type=text
default=guest
maxlen=23
label=Default group
help=Used when an account has no saved group.
live=1

[setting.login_group]
type=text
default=admin
maxlen=23
label=Password login group
help=An owner keeps the owner group.
live=1

[setting.password_login]
type=flag
default=1
label=Allow password login
live=1

[setting.gate_core_commands]
type=flag
default=1
label=Check core command nodes
live=1

[setting.save_login_group]
type=flag
default=0
label=Save the password login group
help=Off keeps the login group until the player leaves.
live=1
