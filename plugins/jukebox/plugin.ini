[plugin]
id=sv.jukebox
version=0.2.0
library=jukebox.dll
api=1
live=1
runtime=native
capabilities=read,write,config
name=MIDI Jukebox
author=Vulpzin
description=Play MIDI music with any game sound.
license=GPL-3.0-only
tags=audio,midi,music

[setting.mode]
type=text
default=voices
maxlen=32
label=Play mode
help=Use voices, phone, keypad or fixed SOUND.
live=1
admin=1

[setting.everyone]
type=flag
default=0
label=Play at every player
live=1
admin=1

[setting.max_per_tick]
type=int
default=8
min=1
max=32
label=Sound calls per tick
live=1
admin=1

[setting.trace]
type=flag
default=0
label=Log MIDI sound calls
help=Demo, scale and chord always log their sound calls.
live=1
admin=1

[setting.bank]
type=text
default=
maxlen=16
label=Legacy bank
help=Old bank setting. Leave empty for mode.
live=1
admin=1

[setting.auto_channels]
type=int
default=3
min=0
max=16
label=Automatic melody channels
help=Keep the busiest channels. Zero plays all channels.
live=1
admin=1

[setting.default_bpm]
type=int
default=0
min=0
max=300
label=Default bpm
live=1
admin=1

[setting.default_speed]
type=int
default=100
min=25
max=400
label=Default speed
live=1
admin=1

[setting.default_key]
type=int
default=0
min=-48
max=48
label=Default key
live=1
admin=1

[setting.default_master]
type=int
default=100
min=0
max=200
label=Default master volume
live=1
admin=1
