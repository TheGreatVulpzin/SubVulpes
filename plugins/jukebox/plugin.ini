[plugin]
id=sv.jukebox
version=0.1.0
library=jukebox.dll
api=1
live=1
runtime=native
capabilities=read,write,config
name=MIDI Jukebox
author=SubVulpes
description=Play MIDI music with phone sounds and body-hit drums.

[setting.bank]
type=text
default=nearest
maxlen=16
label=Phone bank
help=Use nearest, keypad, ring, or digit0 to digit9.
live=1
admin=1

[setting.everyone]
type=flag
default=0
label=Play at every player
live=1
admin=1

[setting.max_per_tick]
type=int
default=8
min=1
max=32
label=Sound calls per tick
live=1
admin=1

[setting.trace]
type=flag
default=0
label=Log MIDI sound calls
help=Demo, scale and chord always log their sound calls.
live=1
admin=1
