[plugin]
id=sv.admcmd
name=Admin Commands
version=0.4.0
library=admcmd.dll
api=1
live=1
capabilities=read,write,props,config,plugins
description=Player tools and server commands.
author=Vulpzin
license=GPL-3.0-only

[setting.admin_group]
type=text
default=admin
maxlen=23
label=Group for give admin
help=The permission service checks the assignment.
live=1

[setting.notify_target]
type=flag
default=1
label=Tell the target
help=A player that another person heals, moves or arms gets a short notice. Bots and the caller get none.
live=1
