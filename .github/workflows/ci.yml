name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository privacy
        run: python -I tools/ci/check_repo.py
      - name: Check Python syntax
        run: python -I -m compileall -q tools
      - name: Check type generation
        run: |
          python -I tools/re/gen_types.py
          git diff --exit-code -- src/include
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x86
      - name: Build server and launcher
        shell: cmd
        run: tools\build_hook.bat
