name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository privacy
        run: python -I tools/ci/check_repo.py
      - name: Check Python syntax
        run: python -I -m compileall -q tools
      - name: Check type generation
        run: |
          python -I tools/re/gen_types.py
          git diff --exit-code -- src/include
      - name: Check storage generation
        run: python -I tools/re/gen_storage.py --check
      - name: Check that the plugin API only grows
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          git show FETCH_HEAD:tests/abi_snapshot.txt > abi_base.txt
          python -I tools/ci/check_abi_additive.py abi_base.txt tests/abi_snapshot.txt
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x86
      - name: Build server and launcher
        shell: cmd
        run: tools\build_hook.bat
      - name: Check native server dependencies
        run: python -I tools/ci/check_native.py
      - name: Run the test suite
        shell: cmd
        working-directory: build\server
        run: ctest -j4 --output-on-failure --timeout 900
